
services:
  next-app:
    build: .
    container_name: next_production_service
    expose:
      - "3000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - next-app
    restart: always
