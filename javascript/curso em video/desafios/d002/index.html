<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios boas-vindas</title>
</head>
<body>
    <h1>Boas-vindas</h1>
    <input type="button" value="Inicie o Desafio" onclick="clicou()">
    <div id="res">

    </div>
    <script>
        function clicou(){
            var nome = window.prompt('Qual é o seu nome')
            var idade = window.prompt(`Olá, ${nome} quantos anos você tem`)
            window.alert(`Acabei de conhecer ${nome}, que tem ${idade} anos de idade!`)
        }
    </script>
</body>
</html>
